adata + versions</text><text x="985" y="480" fill="#52645a" font-size="14">JSON vector store + image files</text><rect x="450" y="570" width="300" height="75" rx="14" fill="#e8efe7" stroke="#a8b9aa" stroke-width="2"/><text x="600" y="600" fill="#244d3c" font-size="18" font-weight="bold">Semantic Retrieval</text><text x="600" y="624" fill="#52645a" font-size="14">Query embedding → cosine similarity → ranked images</text></g><g stroke="#426b55" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M600 170 V215"/><path d="M600 315 V355 H215 V390"/><path d="M600 315 V390"/><path d="M600 315 V355 H985 V390"/><path d="M365 447 H445"/><path d="M750 447 H830"/><path d="M600 500 V565"/><path d="M985 500 V535 H750"/></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="13" fill="#6d7972">Caption embeddings are stored by image ID; query embeddings are compared with cosine similarity.</text></svg>